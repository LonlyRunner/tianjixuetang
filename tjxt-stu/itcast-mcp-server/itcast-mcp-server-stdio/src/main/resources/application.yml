spring:
  main:
    web-application-type: none
    banner-mode: off # 关闭banner，否在会影响调用
  application:
    name: itcast-mcp-server
  ai:
    mcp:
      server:
        enabled: true
        name: ${spring.application.name}
        version: 1.0.0
        type: SYNC # 服务类型 异步，支持 SYNC 和 ASYNC
logging:
  pattern:
    console: #关闭控制台日志输出